        .change-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 35px 30px;
            position: relative;
        }

        /* الهيدر والعنوان */
        .card-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .card-header .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(26, 35, 126, 0.08);
            color: #1a237e;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .card-header h2 {
            color: #1a237e;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .card-header p {
            color: #718096;
            font-size: 0.88rem;
            margin-top: 4px;
        }

        /* الحقول والمدخلات */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 600;
            font-size: 0.88rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            height: 48px;
            padding: 0 42px 0 42px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px; /* يمنع الزوم التلقائي في الآيفون */
            color: #2d3748;
            transition: all 0.3s ease;
            outline: none;
            background-color: #f8fafc;
        }

        .input-wrapper input:focus {
            border-color: #1a237e;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(26, 35, 126, 0.1);
        }

        /* حقل غير قابل للتعديل (اسم المستخدم) */
        .input-wrapper input[readonly] {
            background-color: #edf2f7;
            color: #718096;
            cursor: not-allowed;
            border-color: #e2e8f0;
        }

        .input-icon {
            position: absolute;
            right: 14px;
            color: #a0aec0;
            font-size: 1rem;
            pointer-events: none;
        }

        .toggle-password {
            position: absolute;
            left: 10px;
            padding: 10px;
            color: #a0aec0;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #1a237e;
        }

        /* مؤشر قوة كلمة السر */
        .strength-meter {
            height: 4px;
            background-color: #e2e8f0;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        /* أزرار العمليات */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-submit {
            flex: 2;
            height: 50px;
            background-color: #1a237e;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(26, 35, 126, 0.25);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-cancel {
            flex: 1;
            height: 50px;
            background-color: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-cancel:hover {
            background-color: #edf2f7;
        }

        /* تنبيهات النجاح والخطأ */
        .alert-box {
            display: none;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .alert-danger {
            background-color: #fff5f5;
            color: #e53e3e;
            border: 1px solid #feb2b2;
        }

        .alert-success {
            background-color: #f0fff4;
            color: #38a169;
            border: 1px solid #9ae6b4;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

<main>


    <div class="change-card">
        <!-- هيدر الكارت -->
        <div class="card-header">
            <div class="icon-box">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2>تغيير كلمة السر</h2>
            <p>قم بتحديث كلمة المرور لحماية حسابك</p>
        </div>

        <!-- صندوق الرسائل (أخطاء / نجاح) -->
        <div id="alertBox" class="alert-box"></div>

        <form id="changePasswordForm">
            <!-- اسم المستخدم / الرقم الجامعي -->
            <div class="input-group">
                <label for="username">اسم الدخول / الرقم الجامعي</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-id-card input-icon"></i>
                    <input type="text" id="username" value="250400011" readonly>
                </div>
            </div>

            <!-- كلمة السر القديمة -->
            <div class="input-group">
                <label for="oldPassword">كلمة السر القديمة</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="oldPassword" placeholder="أدخل كلمة السر الحالية" required>
                    <i class="fa-regular fa-eye toggle-password"></i>
                </div>
            </div>

            <!-- كلمة السر الجديدة -->
            <div class="input-group">
                <label for="newPassword">كلمة السر الجديدة</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-shield-halved input-icon"></i>
                    <input type="password" id="newPassword" placeholder="أدخل كلمة السر الجديدة" required>
                    <i class="fa-regular fa-eye toggle-password"></i>
                </div>
                <!-- شريط قياس قوة كلمة السر -->
                <div class="strength-meter" id="strengthMeter">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
            </div>

            <!-- تأكيد كلمة السر الجديدة -->
            <div class="input-group">
                <label for="confirmPassword">تأكيد كلمة السر الجديدة</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-check-double input-icon"></i>
                    <input type="password" id="confirmPassword" placeholder="أعد كتابة كلمة السر الجديدة" required>
                </div>
            </div>

            <!-- أزرار الإجراءات -->
            <div class="button-group">
                <button type="submit" class="btn-submit">حفظ التغييرات</button>
                <a href="main.html" class="btn-cancel">إلغاء</a>
            </div>
        </form>
    </div>
</main>
    <script>
        // 1. تفعيل أيقونة العين لكل الحقول بشكل ديناميكي
        const toggleButtons = document.querySelectorAll('.toggle-password');

        toggleButtons.forEach(button => {
            button.addEventListener('click', function () {
                const input = this.previousElementSibling;
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);

                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
        });

        // 2. مؤشر قوة كلمة السر الجديدة
        const newPasswordInput = document.getElementById('newPassword');
        const strengthMeter = document.getElementById('strengthMeter');
        const strengthBar = document.getElementById('strengthBar');

        newPasswordInput.addEventListener('input', function () {
            const val = this.value;
            if (val.length > 0) {
                strengthMeter.style.display = 'block';
                if (val.length < 6) {
                    strengthBar.style.width = '33%';
                    strengthBar.style.backgroundColor = '#e53e3e'; // ضعيفة (أحمر)
                } else if (val.length < 10) {
                    strengthBar.style.width = '66%';
                    strengthBar.style.backgroundColor = '#dd6b20'; // متوسطة (برتقالي)
                } else {
                    strengthBar.style.width = '100%';
                    strengthBar.style.backgroundColor = '#38a169'; // قوية (أخضر)
                }
            } else {
                strengthMeter.style.display = 'none';
            }
        });

        // 3. التحقق عند حفظ النموذج (Form Submission Validation)
        const form = document.getElementById('changePasswordForm');
        const alertBox = document.getElementById('alertBox');

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const oldPassword = document.getElementById('oldPassword').value.trim();
            const newPassword = document.getElementById('newPassword').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();

            // دالة لإظهار التنبيهات
            function showAlert(message, type) {
                alertBox.textContent = message;
                alertBox.className = `alert-box alert-${type}`;
                alertBox.style.display = 'block';
            }

            // التحقق من كلمة السر القديمة (افتراضيًا: 1234)
            if (oldPassword !== '1234') {
                showAlert('كلمة السر القديمة غير صحيحة!', 'danger');
                return;
            }

            // التأكد من أن كلمة السر الجديدة ليست قصيرة جداً
            if (newPassword.length < 4) {
                showAlert('كلمة السر الجديدة يجب أن تكون 4 أرقام/رموز على الأقل!', 'danger');
                return;
            }

            // التأكد من أن كلمة السر الجديدة تختلف عن القديمة
            if (newPassword === oldPassword) {
                showAlert('كلمة السر الجديدة يجب أن تكون مختلفة عن الحالية!', 'danger');
                return;
            }

            // التأكد من تطابق كلمة السر الجديدة مع التأكيد
            if (newPassword !== confirmPassword) {
                showAlert('كلمة السر الجديدة وتأكيدها غير متطابقين!', 'danger');
                return;
            }

            // في حال نجاح الشروط
            showAlert('تم تغيير كلمة السر بنجاح! جاري التوجيه...', 'success');

            // التوجيه للصفحة الرئيسية بعد ثانية ونصف
            setTimeout(() => {
                window.location.href = 'main.html';
            }, 1500);
        });

function colorchange(){

 document.body.classList.toggle('dark');

const btn =document.getElementById('darkbtn');
const icon=darkbtn.querySelector('i');

if(document.body.classList.contains('dark')){

icon.classList.remove("fa-moon");
icon.classList.add("fa-sun");
}else{

        icon.classList.remove("fa-sun");
        icon.classList.add("fa-moon");
}






}


    </script>
